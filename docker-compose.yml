# =============================================================================
# Alika Medical Training College & Medical Center — Docker Compose Architecture
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alika_portal_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - portal_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: alika_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-alika_school_portal}
      POSTGRES_USER: ${SQL_USER:-postgres}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-postgres_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-postgres} -d ${SQL_DB_NAME:-alika_school_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  portal_uploads:
    driver: local
  postgres_data:
    driver: local
